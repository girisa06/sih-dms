services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dms_user
      POSTGRES_PASSWORD: dms_password
      POSTGRES_DB: dms_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://dms_user:dms_password@db:5432/dms_db
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:
